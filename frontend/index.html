<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI PR Review 助手</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="eyebrow">Pull Request Review Assistant</p>
      <h1>AI PR Review 助手</h1>
      <p class="subtitle">
        输入 PR 描述或代码片段，快速生成风险提示、修改建议和测试建议。
      </p>
    </section>

    <section class="workspace">
      <div class="panel input-panel">
        <div class="panel-header">
          <h2>待分析内容</h2>
          <span>PR 描述 / 代码片段</span>
        </div>
        <textarea id="reviewInput" placeholder="请粘贴 PR 描述、变更说明或代码片段..."></textarea>
        <button id="reviewButton" type="button">开始分析</button>
      </div>

      <div class="panel result-panel">
        <div class="panel-header">
          <h2>分析结果</h2>
          <span>Review 建议</span>
        </div>

        <div class="result-block">
          <h3>风险提示</h3>
          <p id="riskResult">等待分析内容输入后生成。</p>
        </div>

        <div class="result-block">
          <h3>修改建议</h3>
          <p id="suggestionResult">等待分析内容输入后生成。</p>
        </div>

        <div class="result-block">
          <h3>测试建议</h3>
          <p id="testResult">等待分析内容输入后生成。</p>
        </div>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
